<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ page.title | default: site.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}"/>{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"/>
  {% include head-custom.html %}
  <style>
    /* ── Design Tokens ─────────────────────────────────────────── */
    :root {
      --bg:        #0d1117;
      --surface:   #161b27;
      --surface2:  #1e2535;
      --cyan:      #00d4ff;
      --purple:    #7c3aed;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --border:    rgba(255,255,255,.07);
      --font-h:    'Oswald', sans-serif;
      --font-b:    'Inter', sans-serif;
      --nav-h:     68px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-b);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    img { max-width: 100%; height: auto; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    .skip-link {
      position: absolute; top: -100px; left: 16px; z-index: 10000;
      background: var(--cyan); color: #000; padding: 10px 18px;
      border-radius: 0 0 12px 12px; font-weight: 700; font-size: .9rem;
      transition: top .2s;
    }
    .skip-link:focus { top: 0; }

    /* ── Navbar ─────────────────────────────────────────────────── */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 48px);
      background: rgba(13,17,23,.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      transition: background .3s;
    }
    #nav.scrolled { background: rgba(13,17,23,.96); }
    #nav-logo { height: 42px; object-fit: contain; }
    #nav-links {
      display: flex; align-items: center; gap: clamp(4px,1.5vw,24px);
      list-style: none;
    }
    #nav-links a {
      font-size: .92rem; font-weight: 600; color: var(--muted);
      padding: 6px 4px; border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
      white-space: nowrap;
    }
    #nav-links a:hover, #nav-links a.active { color: var(--text); border-color: var(--cyan); }
    .nav-donate {
      margin-left: 8px; padding: 8px 20px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border: none; border-radius: 30px;
      color: #fff; font-size: .88rem; font-weight: 700;
      transition: opacity .2s, transform .15s;
    }
    .nav-donate:hover { opacity: .88; transform: scale(1.04); }

    /* Hamburger */
    #nav-hamburger {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; padding: 4px;
    }
    #nav-hamburger span {
      display: block; width: 24px; height: 2px;
      background: var(--text); border-radius: 2px;
      transition: transform .3s, opacity .3s;
    }
    #nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    #nav-hamburger.open span:nth-child(2) { opacity: 0; }
    #nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 900px) {
      #nav-links {
        display: none; flex-direction: column;
        position: fixed; inset: var(--nav-h) 0 0 0;
        background: rgba(13,17,23,.97); padding: 32px 24px; gap: 0;
        border-top: 1px solid var(--border);
      }
      #nav-links.open { display: flex; }
      #nav-links li { border-bottom: 1px solid var(--border); }
      #nav-links a { display: block; padding: 16px 0; font-size: 1.1rem; }
      #nav-hamburger { display: flex; }
    }

    /* Page body offset for fixed nav */
    #uesl-app-content { padding-top: var(--nav-h); }
    body.embed #nav { display: none; }
    body.embed #uesl-app-content { padding-top: 0; }
  </style>
</head>
<body>
  <a href="#uesl-app-content" class="skip-link">Skip to content</a>

  <!-- ── UESL Navbar ───────────────────────────────────────────── -->
  <nav id="nav" role="navigation" aria-label="Main navigation">
    <a href="/uesl-hub/" aria-label="UESL Home">
      <img id="nav-logo"
        src="https://images.squarespace-cdn.com/content/v1/62745a437b7f84059eb84a95/efa49c03-11c6-4c97-b21e-05266875502d/UnifiedESL-horizontal.png"
        alt="Unified Esports League"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"
      />
      <span style="display:none; font-family:var(--font-h); font-size:1.1rem; color:var(--cyan); font-weight:700;">UESL</span>
    </a>
    <ul id="nav-links" role="list">
      <li><a href="/uesl-hub/">Home</a></li>
      <li><a href="/uesl-hub/#about">About</a></li>
      <li><a href="/uesl-hub/#locations">Locations</a></li>
      <li><a href="/uesl-hub/#game" class="active">Play</a></li>
      <li><a href="/uesl-hub/#contact">Contact</a></li>
      <li>
        <a href="https://www.paypal.com/donate/?hosted_button_id=UYQT933YT3S32"
           class="nav-donate" target="_blank" rel="noopener">Donate</a>
      </li>
    </ul>
    <button id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div id="uesl-app-content">
    {{ content }}
  </div>

  <script>
    // Embed mode — hide nav when loaded inside social overlay iframe
    if (new URLSearchParams(location.search).get('embed')) {
      document.body.classList.add('embed');
    }

    // Scroll class
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 60);
    }, { passive: true });

    // Hamburger
    const ham = document.getElementById('nav-hamburger');
    const nl  = document.getElementById('nav-links');
    ham.addEventListener('click', () => {
      const open = nl.classList.toggle('open');
      ham.classList.toggle('open', open);
      ham.setAttribute('aria-expanded', open);
    });
    nl.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        nl.classList.remove('open');
        ham.classList.remove('open');
        ham.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
</body>
</html>
