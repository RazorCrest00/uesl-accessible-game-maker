<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Tail -->
  <path d="M 138 165 Q 174 150 172 128 Q 169 108 158 104"
    stroke="#E8601A" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Flame layers -->
  <ellipse cx="163" cy="96" rx="13" ry="19" fill="#FF6000" transform="rotate(-20 163 96)"/>
  <ellipse cx="157" cy="94" rx="9" ry="14" fill="#FFA500" transform="rotate(-10 157 94)"/>
  <ellipse cx="164" cy="90" rx="6" ry="10" fill="#FFD700" transform="rotate(12 164 90)"/>

  <!-- Body -->
  <ellipse cx="96" cy="148" rx="48" ry="44" fill="#E8601A"/>

  <!-- Head -->
  <ellipse cx="100" cy="86" rx="48" ry="46" fill="#E8601A"/>

  <!-- Belly -->
  <ellipse cx="96" cy="155" rx="30" ry="28" fill="#F5CBA0"/>
  <!-- Neck belly -->
  <ellipse cx="98" cy="120" rx="22" ry="17" fill="#F5CBA0"/>

  <!-- Left arm -->
  <ellipse cx="48" cy="136" rx="15" ry="9" fill="#E8601A" transform="rotate(-40 48 136)"/>
  <!-- Left claws -->
  <line x1="37" y1="125" x2="33" y2="119" stroke="#E8601A" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="122" x2="40" y2="115" stroke="#E8601A" stroke-width="4" stroke-linecap="round"/>

  <!-- Right arm -->
  <ellipse cx="148" cy="136" rx="15" ry="9" fill="#E8601A" transform="rotate(40 148 136)"/>
  <!-- Right claws -->
  <line x1="157" y1="125" x2="162" y2="119" stroke="#E8601A" stroke-width="4" stroke-linecap="round"/>
  <line x1="153" y1="122" x2="156" y2="115" stroke="#E8601A" stroke-width="4" stroke-linecap="round"/>

  <!-- Left leg -->
  <ellipse cx="75" cy="183" rx="20" ry="13" fill="#E8601A"/>
  <!-- Right leg -->
  <ellipse cx="120" cy="183" rx="20" ry="13" fill="#E8601A"/>

  <!-- Foot claws -->
  <line x1="63" y1="191" x2="59" y2="197" stroke="#C04C00" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="193" x2="75" y2="199" stroke="#C04C00" stroke-width="3" stroke-linecap="round"/>
  <line x1="87" y1="191" x2="91" y2="197" stroke="#C04C00" stroke-width="3" stroke-linecap="round"/>
  <line x1="108" y1="191" x2="104" y2="197" stroke="#C04C00" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="193" x2="120" y2="199" stroke="#C04C00" stroke-width="3" stroke-linecap="round"/>
  <line x1="132" y1="191" x2="136" y2="197" stroke="#C04C00" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="82" cy="80" r="13" fill="#111"/>
  <circle cx="88" cy="75" r="5" fill="white"/>
  <circle cx="118" cy="80" r="13" fill="#111"/>
  <circle cx="124" cy="75" r="5" fill="white"/>

  <!-- Nostrils -->
  <ellipse cx="96" cy="94" rx="3" ry="2" fill="#C04C00"/>
  <ellipse cx="104" cy="94" rx="3" ry="2" fill="#C04C00"/>

  <!-- Mouth -->
  <path d="M 88 102 Q 100 112 112 102" stroke="#C04C00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
