<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Bulb stem/base (behind body) -->
  <ellipse cx="108" cy="80" rx="36" ry="30" fill="#5D8A4A"/>
  <!-- Bulb leaves -->
  <ellipse cx="85" cy="54" rx="18" ry="30" fill="#4A7A38" transform="rotate(-22 85 54)"/>
  <ellipse cx="112" cy="46" rx="16" ry="27" fill="#5D8A4A" transform="rotate(8 112 46)"/>
  <ellipse cx="134" cy="60" rx="15" ry="23" fill="#4A7A38" transform="rotate(36 134 60)"/>

  <!-- Body -->
  <ellipse cx="95" cy="150" rx="56" ry="44" fill="#78C060"/>

  <!-- Head -->
  <ellipse cx="90" cy="96" rx="52" ry="50" fill="#78C060"/>

  <!-- Underbelly -->
  <ellipse cx="90" cy="158" rx="38" ry="28" fill="#A8D89A"/>

  <!-- Body dark spots -->
  <circle cx="60" cy="130" r="10" fill="#5CA848" opacity="0.65"/>
  <circle cx="124" cy="128" r="12" fill="#5CA848" opacity="0.65"/>
  <circle cx="84" cy="148" r="13" fill="#5CA848" opacity="0.55"/>
  <circle cx="116" cy="160" r="10" fill="#5CA848" opacity="0.55"/>

  <!-- Left front leg -->
  <ellipse cx="50" cy="176" rx="16" ry="20" fill="#78C060"/>
  <!-- Right front leg -->
  <ellipse cx="142" cy="176" rx="16" ry="20" fill="#78C060"/>
  <!-- Left back leg -->
  <ellipse cx="66" cy="188" rx="20" ry="12" fill="#78C060"/>
  <!-- Right back leg -->
  <ellipse cx="128" cy="188" rx="20" ry="12" fill="#78C060"/>

  <!-- Toe lines -->
  <line x1="41" y1="188" x2="38" y2="195" stroke="#5A9A48" stroke-width="3" stroke-linecap="round"/>
  <line x1="51" y1="191" x2="51" y2="198" stroke="#5A9A48" stroke-width="3" stroke-linecap="round"/>
  <line x1="61" y1="188" x2="64" y2="195" stroke="#5A9A48" stroke-width="3" stroke-linecap="round"/>
  <line x1="133" y1="188" x2="130" y2="195" stroke="#5A9A48" stroke-width="3" stroke-linecap="round"/>
  <line x1="143" y1="191" x2="143" y2="198" stroke="#5A9A48" stroke-width="3" stroke-linecap="round"/>
  <line x1="153" y1="188" x2="156" y2="195" stroke="#5A9A48" stroke-width="3" stroke-linecap="round"/>

  <!-- Ear bumps -->
  <ellipse cx="48" cy="74" rx="12" ry="17" fill="#78C060"/>
  <ellipse cx="132" cy="74" rx="12" ry="17" fill="#78C060"/>

  <!-- Left eye -->
  <circle cx="66" cy="90" r="15" fill="#C0282A"/>
  <circle cx="71" cy="84" r="6" fill="white"/>
  <circle cx="70" cy="83" r="3" fill="#111"/>

  <!-- Right eye -->
  <circle cx="114" cy="90" r="15" fill="#C0282A"/>
  <circle cx="119" cy="84" r="6" fill="white"/>
  <circle cx="118" cy="83" r="3" fill="#111"/>

  <!-- Nose -->
  <ellipse cx="88" cy="108" rx="4" ry="3" fill="#5A9A48"/>

  <!-- Mouth -->
  <path d="M 74 116 Q 88 128 102 116" stroke="#4A7A38" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
