<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Tail (drawn first so it sits behind body) -->
  <polyline points="148,162 163,140 154,128 173,104 163,113 175,86"
    stroke="#F5D03E" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="148,162 163,140 154,128 173,104 163,113 175,86"
    stroke="#C8A000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left ear -->
  <polygon points="60,70 48,12 85,60" fill="#F5D03E"/>
  <polygon points="63,65 54,24 80,60" fill="#1A1A1A"/>

  <!-- Right ear -->
  <polygon points="118,70 152,12 140,60" fill="#F5D03E"/>
  <polygon points="120,65 148,24 136,60" fill="#1A1A1A"/>

  <!-- Head -->
  <ellipse cx="100" cy="88" rx="50" ry="46" fill="#F5D03E"/>

  <!-- Body -->
  <ellipse cx="100" cy="144" rx="52" ry="46" fill="#F5D03E"/>

  <!-- Belly patch -->
  <ellipse cx="100" cy="152" rx="34" ry="28" fill="#D49500"/>

  <!-- Left arm -->
  <ellipse cx="48" cy="138" rx="17" ry="10" fill="#F5D03E" transform="rotate(-35 48 138)"/>
  <!-- Right arm -->
  <ellipse cx="152" cy="138" rx="17" ry="10" fill="#F5D03E" transform="rotate(35 152 138)"/>

  <!-- Left foot -->
  <ellipse cx="76" cy="183" rx="22" ry="13" fill="#F5D03E"/>
  <!-- Right foot -->
  <ellipse cx="124" cy="183" rx="22" ry="13" fill="#F5D03E"/>

  <!-- Left cheek -->
  <circle cx="54" cy="102" r="16" fill="#E8321E" opacity="0.9"/>
  <!-- Right cheek -->
  <circle cx="146" cy="102" r="16" fill="#E8321E" opacity="0.9"/>

  <!-- Left eye -->
  <circle cx="78" cy="84" r="13" fill="#111"/>
  <circle cx="83" cy="79" r="5" fill="white"/>

  <!-- Right eye -->
  <circle cx="122" cy="84" r="13" fill="#111"/>
  <circle cx="127" cy="79" r="5" fill="white"/>

  <!-- Nose -->
  <ellipse cx="100" cy="97" rx="3.5" ry="2.5" fill="#222"/>

  <!-- Mouth -->
  <path d="M 89 106 Q 94 115 100 113 Q 106 115 111 106"
    stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Back stripe hints -->
  <path d="M 70 78 Q 75 73 82 77" stroke="#B88A00" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 118 77 Q 125 73 130 78" stroke="#B88A00" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
